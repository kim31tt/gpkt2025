<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tabi | Kimie</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <section class="profile js-tilt">

      <div class="cover reveal">
        <img src="assets/background.jpg" alt="background image">
      </div>

      <img class="avatar reveal" src="assets/icon.jpg" alt="Kimie icon">

      <h1 class="reveal">貴美恵</h1>
      <p class="name reveal">Kimie</p>

      <p class="bio reveal">
        Traveler from Japan 🇯🇵<br>
        Always happy to meet travelers 🌍
      </p>

      <div class="info">

        <section class="panel reveal">
          <span class="label">Love</span>
          <p>
            🩰 Ballet<br>
            🎨 Art<br>
            ☕ Cafés<br>
            ✈️ Solo travel
          </p>
        </section>

        <section class="panel reveal">
          <span class="label">Visited</span>

          <div class="visited-grid">

            <button class="country-card" type="button" data-country="france">
              <span class="flag">🇫🇷</span>
              <span class="cities">パリ、モン・サン・ミシェル、ニース</span>
            </button>

            <button class="country-card" type="button" data-country="usa">
              <span class="flag">🇺🇸</span>
              <span class="cities">ニューヨーク、サンノゼ、ロサンゼルス、サンフランシスコ</span>
            </button>

            <button class="country-card" type="button" data-country="korea">
              <span class="flag">🇰🇷</span>
              <span class="cities">ソウル</span>
            </button>

            <button class="country-card" type="button" data-country="australia">
              <span class="flag">🇦🇺</span>
              <span class="cities">シドニー、ケアンズ</span>
            </button>

            <button class="country-card" type="button" data-country="taiwan">
              <span class="flag">🇹🇼</span>
              <span class="cities">台北、台中</span>
            </button>

            <button class="country-card" type="button" data-country="malaysia">
              <span class="flag">🇲🇾</span>
              <span class="cities">クアラルンプール</span>
            </button>

            <button class="country-card" type="button" data-country="singapore">
              <span class="flag">🇸🇬</span>
              <span class="cities">シンガポール</span>
            </button>

            <button class="country-card" type="button" data-country="hongkong">
              <span class="flag">🇭🇰</span>
              <span class="cities">香港</span>
            </button>

            <button class="country-card" type="button" data-country="macau">
              <span class="flag">🇲🇴</span>
              <span class="cities">マカオ</span>
            </button>

            <button class="country-card" type="button" data-country="italy">
              <span class="flag">🇮🇹</span>
              <span class="cities">ローマ、ミラノ</span>
            </button>

            <button class="country-card" type="button" data-country="vatican">
              <span class="flag">🇻🇦</span>
              <span class="cities">バチカン市国</span>
            </button>

            <button class="country-card" type="button" data-country="uk">
              <span class="flag">🇬🇧</span>
              <span class="cities">ロンドン</span>
            </button>

            <button class="country-card" type="button" data-country="vietnam">
              <span class="flag">🇻🇳</span>
              <span class="cities">ハノイ、ニンビン</span>
            </button>

            <button class="country-card" type="button" data-country="thailand">
              <span class="flag">🇹🇭</span>
              <span class="cities">バンコク、パタヤ</span>
            </button>

            <button class="country-card" type="button" data-country="turkey">
              <span class="flag">🇹🇷</span>
              <span class="cities">ブルサ、イスタンブール</span>
            </button>

            <button class="country-card" type="button" data-country="bulgaria">
              <span class="flag">🇧🇬</span>
              <span class="cities">リラ、ソフィア</span>
            </button>

            <button class="country-card" type="button" data-country="estonia">
              <span class="flag">🇪🇪</span>
              <span class="cities">タリン</span>
            </button>

            <button class="country-card" type="button" data-country="finland">
              <span class="flag">🇫🇮</span>
              <span class="cities">ヘルシンキ</span>
            </button>

            <button class="country-card" type="button" data-country="morocco">
              <span class="flag">🇲🇦</span>
              <span class="cities">マラケシュ</span>
            </button>

            <button class="country-card" type="button" data-country="monaco">
              <span class="flag">🇲🇨</span>
              <span class="cities">モナコ</span>
            </button>

            <button class="country-card" type="button" data-country="canada">
              <span class="flag">🇨🇦</span>
              <span class="cities">モントリオール、ケベック</span>
            </button>

          </div>
        </section>

        <section class="panel reveal">
          <span class="label">Currently in</span>
          <p>Japan 🇯🇵</p>
        </section>

      </div>

      <div class="links reveal">
        <a href="https://www.instagram.com/31ki_t/" target="_blank" rel="noopener">
          Follow my journey → Instagram
        </a>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
