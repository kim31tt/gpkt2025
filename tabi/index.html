<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tabi | Kimie</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <section class="profile js-tilt">

      <div class="hero reveal">
        <img class="cover" src="assets/background.jpg" alt="Airplane window view" />
        <img class="avatar" src="assets/icon.jpg" alt="Kimie profile photo" />
      </div>

      <div class="profile-main">
        <div class="intro-block">
          <h1 class="reveal">Kimie</h1>
          <p class="name reveal">貴美恵</p>

          <p class="bio reveal">
            Traveler from Japan 🇯🇵<br />
            Always happy to meet travelers 🌍
          </p>

          <section class="panel love-panel reveal">
            <span class="label">Love</span>
            <div class="love-grid">
              <span>🩰 Ballet</span>
              <span>🎨 Art</span>
              <span>☕ Cafés</span>
              <span>✈️ Solo travel</span>
            </div>
          </section>

          <div class="links reveal">
            <a href="https://www.instagram.com/31ki_t/" target="_blank" rel="noopener">
              Follow my journey → Instagram
            </a>
          </div>
        </div>

        <section class="panel visited-panel reveal">
          <div class="visited-head">
            <span class="label">Visited</span>
            <p>Tap a flag to see the cities.</p>
          </div>

          <div class="visited-grid">
            <button class="country-card" type="button"><span class="flag">🇫🇷</span><span class="cities">Paris, Mont Saint-Michel, Nice</span></button>
            <button class="country-card" type="button"><span class="flag">🇺🇸</span><span class="cities">New York, San Jose, Los Angeles, San Francisco</span></button>
            <button class="country-card" type="button"><span class="flag">🇰🇷</span><span class="cities">Seoul</span></button>
            <button class="country-card" type="button"><span class="flag">🇦🇺</span><span class="cities">Sydney, Cairns</span></button>
            <button class="country-card" type="button"><span class="flag">🇹🇼</span><span class="cities">Taipei, Taichung</span></button>
            <button class="country-card" type="button"><span class="flag">🇲🇾</span><span class="cities">Kuala Lumpur</span></button>
            <button class="country-card" type="button"><span class="flag">🇸🇬</span><span class="cities">Singapore</span></button>
            <button class="country-card" type="button"><span class="flag">🇭🇰</span><span class="cities">Hong Kong</span></button>
            <button class="country-card" type="button"><span class="flag">🇲🇴</span><span class="cities">Macau</span></button>
            <button class="country-card" type="button"><span class="flag">🇮🇹</span><span class="cities">Rome, Milan</span></button>
            <button class="country-card" type="button"><span class="flag">🇻🇦</span><span class="cities">Vatican City</span></button>
            <button class="country-card" type="button"><span class="flag">🇬🇧</span><span class="cities">London</span></button>
            <button class="country-card" type="button"><span class="flag">🇻🇳</span><span class="cities">Hanoi, Ninh Binh</span></button>
            <button class="country-card" type="button"><span class="flag">🇹🇭</span><span class="cities">Bangkok, Pattaya</span></button>
            <button class="country-card" type="button"><span class="flag">🇹🇷</span><span class="cities">Bursa, Istanbul</span></button>
            <button class="country-card" type="button"><span class="flag">🇧🇬</span><span class="cities">Rila, Sofia</span></button>
            <button class="country-card" type="button"><span class="flag">🇪🇪</span><span class="cities">Tallinn</span></button>
            <button class="country-card" type="button"><span class="flag">🇫🇮</span><span class="cities">Helsinki</span></button>
            <button class="country-card" type="button"><span class="flag">🇲🇦</span><span class="cities">Marrakech</span></button>
            <button class="country-card" type="button"><span class="flag">🇲🇨</span><span class="cities">Monaco</span></button>
            <button class="country-card" type="button"><span class="flag">🇨🇦</span><span class="cities">Montreal, Quebec</span></button>
          </div>
        </section>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
