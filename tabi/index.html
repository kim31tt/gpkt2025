<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="貴美恵（Kimie）の旅プロフィールページ。話せる言語、出身、訪れた国を紹介します。" />
  <title>Kimie | Travel Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-map" aria-hidden="true"></div>

  <main class="profile-card">
    <section class="hero">
      <div class="photo-wrap">
        <img src="assets/profile-placeholder.svg" alt="貴美恵（Kimie）のプロフィール写真" class="profile-photo" />
      </div>

      <p class="eyebrow">Travel Profile</p>
      <h1>貴美恵 <span>Kimie</span></h1>
      <p class="intro">
        日本から来ました。旅先で出会った人と、言葉や文化を通してつながることが好きです。
      </p>
    </section>

    <section class="info-grid" aria-label="プロフィール情報">
      <div class="info-box">
        <span class="icon">🗾</span>
        <div>
          <h2>From</h2>
          <p>日本 / Japan</p>
        </div>
      </div>

      <div class="info-box">
        <span class="icon">🗣️</span>
        <div>
          <h2>Languages</h2>
          <p>日本語 ◎ / English ◯ / Français △</p>
        </div>
      </div>
    </section>

    <section class="visited">
      <h2>Places I’ve visited</h2>
      <p class="subtext">旅の思い出がある場所</p>
      <div class="flag-list" aria-label="訪れた場所の国旗一覧">
        <span>🇫🇷</span><span>🇺🇸</span><span>🇰🇷</span><span>🇦🇺</span><span>🇹🇼</span><span>🇲🇾</span><span>🇸🇬</span><span>🇭🇰</span><span>🇲🇴</span><span>🇮🇹</span><span>🇻🇦</span><span>🇬🇧</span><span>🇻🇳</span><span>🇹🇭</span><span>🇹🇷</span><span>🇧🇬</span><span>🇪🇪</span><span>🇫🇮</span><span>🇲🇦</span><span>🇲🇨</span><span>🇨🇦</span>
      </div>
    </section>

    <section class="message">
      <h2>Nice to meet you!</h2>
      <p>
        もし旅先で会ったら、あなたの国やおすすめの場所を教えてください。
      </p>
    </section>
  </main>
</body>
</html>
